<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact · Tonia Johnsen</title>
    <meta name="description" content="Contact Tonia Johnsen." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-screen">
    <header class="site-header">
      <div class="wrap nav">
        <a class="brand" href="/">Tonia Johnsen</a>
        <button
          class="nav-toggle"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-links"
          aria-label="Menu"
        >
          <span class="nav-toggle-bar" aria-hidden="true"></span>
          <span class="nav-toggle-bar" aria-hidden="true"></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a data-nav href="/gallery.html">Gallery</a></li>
          <li><a data-nav href="/available.html">Available Work</a></li>
          <li><a data-nav href="/commissions.html">Commissions</a></li>
          <li><a data-nav href="/about.html">About</a></li>
          <li><a data-nav href="/contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <main>
      <div class="wrap-narrow">
        <header class="page-intro">
          <h1>Contact</h1>
          <p>For purchases, commissions, or general questions.</p>
        </header>
        <div class="content-block">
          <form class="form" id="contact-form" data-endpoint="/api/contact" novalidate>
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" required autocomplete="name" />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" required rows="6"></textarea>
            </div>
            <button type="submit" class="btn btn-block">Send</button>
            <p class="form-msg" id="form-msg" hidden></p>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <span>&copy; <span id="year"></span> Tonia Johnsen</span>
      </div>
    </footer>

    <script src="/js/site.js"></script>
    <script src="/js/contact.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const subject = params.get("subject");
        const message = document.getElementById("message");
        if (subject && message && !message.value) {
          message.value =
            subject === "Commission"
              ? "I am interested in commissioning an original painting.\n\nSize / space:\nPalette / mood:\nTimeline:\n"
              : "";
        }
      })();
    </script>
  </body>
</html>
