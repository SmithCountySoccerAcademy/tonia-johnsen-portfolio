<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery · Tonia Johnsen</title>
    <meta
      name="description"
      content="Gallery of original paintings by Tonia Johnsen."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-gallery">
    <header class="site-header">
      <div class="wrap nav">
        <a class="brand" href="/">Tonia Johnsen</a>
        <button
          class="nav-toggle"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-links"
          aria-label="Menu"
        >
          <span class="nav-toggle-bar" aria-hidden="true"></span>
          <span class="nav-toggle-bar" aria-hidden="true"></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a data-nav href="/gallery.html">Gallery</a></li>
          <li><a data-nav href="/available.html">Available Work</a></li>
          <li><a data-nav href="/commissions.html">Commissions</a></li>
          <li><a data-nav href="/about.html">About</a></li>
          <li><a data-nav href="/contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <main
      class="snap-scroller"
      id="gallery-snap"
      tabindex="0"
      aria-label="Gallery paintings"
    >
      <!-- Full-screen slides injected by gallery.js -->
    </main>

    <div class="snap-progress" id="snap-progress" aria-live="polite" hidden>
      <span id="snap-index">1</span>
      <span class="snap-progress-sep">/</span>
      <span id="snap-total">1</span>
    </div>

    <script src="/js/site.js"></script>
    <script src="/js/gallery.js"></script>
  </body>
</html>
