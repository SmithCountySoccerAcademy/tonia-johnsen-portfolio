<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tonia Johnsen · Original Paintings</title>
    <meta
      name="description"
      content="Original paintings by Tonia Johnsen."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-home">
    <header class="site-header">
      <div class="wrap nav">
        <a class="brand" href="/">Tonia Johnsen</a>
        <button
          class="nav-toggle"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-links"
          aria-label="Menu"
        >
          <span class="nav-toggle-bar" aria-hidden="true"></span>
          <span class="nav-toggle-bar" aria-hidden="true"></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a data-nav href="/gallery.html">Gallery</a></li>
          <li><a data-nav href="/available.html">Available Work</a></li>
          <li><a data-nav href="/commissions.html">Commissions</a></li>
          <li><a data-nav href="/about.html">About</a></li>
          <li><a data-nav href="/contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <main class="home-main">
      <section class="hero wrap" aria-label="Featured work">
        <div class="hero-copy">
          <p class="hero-kicker">Original paintings</p>
          <h1>Work that holds a wall&nbsp;— and a room.</h1>
          <a class="hero-cta" href="/available.html">
            Available work
            <span class="hero-cta-arrow" aria-hidden="true">→</span>
          </a>
        </div>

        <figure class="hero-art">
          <img
            id="hero-image"
            src="/assets/placeholders/ember-field.svg"
            alt="Featured painting"
            width="800"
            height="1000"
          />
          <figcaption id="hero-caption">Ember Field · 36 × 48 in</figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer site-footer--home">
      <div class="wrap footer-inner">
        <span>&copy; <span id="year"></span> Tonia Johnsen</span>
      </div>
    </footer>

    <script src="/js/site.js"></script>
    <script src="/js/home.js"></script>
  </body>
</html>
