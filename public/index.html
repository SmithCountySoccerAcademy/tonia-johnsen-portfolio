    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-home">
    <header class="site-header site-header--home">
      <div class="wrap nav">
        <a class="brand" href="/">Tonia Johnsen</a>
        <button
          class="nav-toggle"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-links"
          aria-label="Menu"
        >
          <span class="nav-toggle-bar" aria-hidden="true"></span>
          <span class="nav-toggle-bar" aria-hidden="true"></span>

        <ul class="nav-links" id="nav-links">
          <li><a data-nav href="/gallery.html">Gallery</a></li>

            <a class="hero-link" href="/gallery.html">View gallery</a>
          </div>
        </div>

        <figure class="hero-frame">
          <div class="hero-image-wrap">
            <img
              id="hero-image"
              src="/assets/placeholders/ember-field.svg"
              alt="Featured painting"
            />
          </div>
          <figcaption id="hero-caption">Ember Field · 36 × 48 in</figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer site-footer--home">
      <div class="wrap footer-inner">
        <span>&copy; <span id="year"></span> Tonia Johnsen</span>

    </footer>

    <script src="/js/site.js"></script>
